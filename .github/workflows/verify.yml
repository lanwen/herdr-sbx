name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Download pinned dependencies
        run: mise run deps
      - name: Verify formatting, isolated race tests, vet, and build
        run: mise run verify-change
      - name: Test publishing helper without network access
        run: python3 -m unittest discover -s scripts -p 'test_publish_pr_images.py'
