name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
      - name: Download pinned dependencies
        run: mise run deps
      - name: Verify action pins, formatting, isolated race tests, vet, and build
        run: mise run verify-change
      - name: Test workflow helpers without network access
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
