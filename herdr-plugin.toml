id = "lanwen.herdr-sbx"
name = "lanwen/herdr-sbx"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Inspect local sandbox readiness, prepare missing guest Herdr, and register machines."
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-o", "bin/herdr-sbx", "./cmd/herdr-sbx"]

[[startup]]
command = ["./bin/herdr-sbx", "daemon", "start", "--automatic"]

[[events]]
on = "workspace.created"
command = ["./bin/herdr-sbx", "daemon", "start", "--automatic"]

[[panes]]
id = "status"
title = "lanwen/herdr-sbx"
placement = "popup"
width = 110
height = 32
command = ["./bin/herdr-sbx"]

[[actions]]
id = "open-status"
title = "lanwen/herdr-sbx status"
description = "Open the Docker Sandboxes status panel in a 110 by 32 cell popup."
command = ["./bin/herdr-sbx", "open-status"]

[[actions]]
id = "open-status-tab"
title = "lanwen/herdr-sbx status tab"
description = "Open the Docker Sandboxes status panel in a tab."
command = ["./bin/herdr-sbx", "open-status-tab"]

[[actions]]
id = "open-status-split"
title = "lanwen/herdr-sbx status split"
description = "Open the Docker Sandboxes status panel in a split."
command = ["./bin/herdr-sbx", "open-status-split"]

[[actions]]
id = "status"
title = "lanwen/herdr-sbx daemon status"
description = "Report cached sandbox and background daemon status."
command = ["./bin/herdr-sbx", "status"]
