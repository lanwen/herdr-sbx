[tools]
go = "1.27.3"

[tasks.deps]
description = "Download pinned Go modules"
run = "go mod download"

[tasks.build]
description = "Build the linked plugin executable"
run = "go build -o bin/herdr-sbx ./cmd/herdr-sbx"

[tasks.link]
description = "Build and link the plugin into Herdr"
depends = ["build"]
run = "herdr plugin link . --enabled"

[tasks.fmt]
description = "Format Go source"
run = "gofmt -w cmd internal"

[tasks.go-lint]
description = "Run pinned Go linters"
tools.golangci-lint = "2.15.0"
run = "golangci-lint run ./..."

[tasks.shellcheck]
description = "Check POSIX shell scripts"
tools.shellcheck = "0.11.0"
run = "shellcheck scripts/*.sh"

[tasks.lint]
description = "Check Go and shell source"
depends = ["go-lint", "shellcheck"]

[tasks.vulncheck]
description = "Check reachable Go vulnerabilities (requires network access)"
tools."go:golang.org/x/vuln/cmd/govulncheck" = "1.1.4"
run = "govulncheck ./..."

[tasks.test]
description = "Run tests with isolated HOME and Herdr state"
run = "python3 scripts/test-go.py test -timeout 60s ./... -count=1"

[tasks.test-race]
description = "Run isolated tests with the Go race detector"
run = "python3 scripts/test-go.py test -race -timeout 60s ./... -count=1"

[tasks.vet]
description = "Run Go static checks"
run = "python3 scripts/test-go.py vet ./..."

[tasks.check]
description = "Run isolated race tests and static checks"
depends = ["test-race", "vet"]

[tasks.test-panel]
description = "Exercise the panel in a PTY with fake external commands"
run = 'GO_BIN="$(command -v go)" python3 scripts/test-panel-pty.py'

[tasks.test-worker]
description = "Exercise worker lifetime against two isolated Herdr servers and a fake sandbox daemon"
run = '''
test_root=$(mktemp -d /tmp/herdr-sbx-worker-gate.XXXXXX)
trap 'rm -rf "$test_root"' EXIT
export GOMODCACHE="$(go env GOMODCACHE)"
export GOCACHE="${GOCACHE:-$test_root/go-cache}"
HERDR_WORKER_TEST_ROOT="$test_root/fixture" sh scripts/test-worker-lifetime.sh
'''

[tasks.test-real]
description = "Opt-in: requires a dedicated authenticated disposable sandbox fixture"
run = "sh scripts/test-real.sh"

[tasks.fmt-check]
description = "Check Go formatting without changing files"
run = "sh scripts/check-format.sh"

[tasks.verify-panel]
description = "Run isolated panel tests, then rebuild the linked executable"
run = ["python3 scripts/test-go.py test ./internal/panel -count=1", "mise run build"]

[tasks.verify-change]
description = "Check action pins, formatting, lint, vulnerabilities, isolated race tests and vet, then build"
run = ["mise run action-pins-check", "mise run fmt-check", "mise run lint", "mise run vulncheck", "mise run check", "mise run build"]

[tasks.capture-screenshots]
description = "Capture simulated terminal frames (macOS; optional output directory/background)"
run = "sh scripts/capture-screenshots.sh"

[tasks.publish-pr-images]
description = "Publish an explicit PR body and image files, then verify uploaded links"
run = "python3 scripts/publish-pr-images.py"

[tasks.action-pins-check]
description = "Check immutable GitHub Action references (requires Ruby/Psych)"
run = "ruby scripts/check-action-pins.rb"
